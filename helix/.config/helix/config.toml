# "F13" = "command_palette"

[keys.select]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
0   = "goto_line_start"

[keys.select.tab]
p = "@|plz "

# TODO: set up leader key
# 1) leader: selection+extend
# 2) leader: cut/yank/delete
# 3) leader: file/buffer operations
# 3) shell piping commands
# 4) split (?)
# 5) jumplist

[keys.normal."A-backspace"]
r = ":config-reload"
o = ":config-open"
l = ":o ~/.config/helix/languages.toml"
w = ":o ~/.wezterm.lua"
t = ":o ~/.config/ghostty.toml"
k = ":o ~/.config/karabiner/karabiner.json"
z = ":o ~/.config/zellij/config.kdl"
y = ":o ~/.config/yazi/yazi.toml"
"." = ":o ~/.zshrc"
d = ":log-open"

# TODO: leader key candidates: Space, Backspace, '\', <more> 
# TODO: clean up - move stuff from here to backspace, leave here file stuff
[keys.normal.tab] # Work with files
1="extend_search_next"
2="extend_search_prev"
3="extend_next_char"
4="extend_till_char"
"#"="extend_prev_char"
"$"="extend_till_prev_char"
w="extend_next_word_end"
b="extend_prev_word_start"
","="kill_to_line_start"
"."="kill_to_line_end"
"S->"="extend_to_line_end"
"S-<"="extend_to_line_start"
backspace="delete_word_backward"
S-backspace="delete_word_forward"
q={q=":bc", w=":wq", e=":q",1=":bc!","2"=":wq!","3"=":q!"}
# q=":buffer-close"
s=":w"
"D"=["delete_selection", "move_char_left"]
"g"=["keep_primary_selection"]
tab = ["goto_first_nonwhitespace",  "extend_to_line_end_newline"]
left="extend_to_line_start"
right="extend_to_line_end"
up="extend_parent_node_start"
down="extend_parent_node_end"

# [keys.normal.tab.q]
# q=":buffer-close"
# w=":wq"
# e=":q"
# 1=":bc!"
# 2=":wq!"
# 3=":q!"

# TODO: add duplicate line with one motion

[keys.normal.'\']
"a"="select_all_siblings"


[keys.normal.backspace.e]
n = "extend_to_first_nonwhitespace"
w = "extend_to_word"
x = "extend_line"
h = "extend_to_line_start"
u = "extend_to_line_start"
l = "extend_to_line_end"
o = "extend_to_line_end"
L = "extend_to_line_end_newline"

[keys.normal.backspace.g]
n="goto_first_nonwhitespace"
"."="goto_last_modification"

[keys.normal.backspace]
"=" = ["extend_to_line_bounds", "yank", "paste_after"]
# backspace = ["save_selection", "extend_to_line_bounds", "yank", "paste_after", "jump_backward"]
backspace = "suspend"

# [commands]

[keys.insert]
Cmd-s = ":w"
Cmd-S-s = ":write-buffer-close"
Cmd-q = ":buffer-close"
Cmd-c = "yank_main_selection_to_clipboard"
C-c = "yank_main_selection_to_clipboard"
C-s = ":w"
C-S-s = ":write-buffer-close"
C-q = ":buffer-close"
C-1 = ":buffer-close!"
C-S-q = ":q!"
C-right =["move_next_word_start"]
C-left = ["move_prev_word_end"]
Cmd-e = ["collapse_selection", "keep_primary_selection", "normal_mode"]

