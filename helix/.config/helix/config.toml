# theme = "merionette"
# theme = "modus_vivendi_tritanopia"
# theme = "horizon-dark"
theme = "ao"

[editor]
true-color = true
color-modes = true
bufferline = "always"
line-number = "relative"
auto-info = true
auto-pairs = false
cursorline = true
idle-timeout = 0
# whitespace = "all"
# insert-final-newline = false
# gutters = ["diff", "diagnostics", "line-numbers", "spacer"]

# [editor.whitespace]
# render = "all"
# or control each character
[editor.whitespace.render]
space = "none"
# newline = "all"
# space = "all"
# tab = "all"
# nbsp = "none"
# nnbsp = "none"

[editor.file-picker]
hidden = false

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true
# display-inlay-hints = false
auto-signature-help = true
display-signature-help-docs = true
display-progress-messages = true

[editor.soft-wrap]
enable = true
wrap-indicator = "        ↪"

[editor.smart-tab]
enable = false

[editor.indent-guides]
render = true
skip-levels = 1
# character ="│"  # ┊︙"┊"#¦ı·¿¿⁞⋮┆┊︙⁞⋮┆┊︙│
character ="┊"
# character ="┆"

[editor.statusline]
# left   = ["mode", "spinner", "file-name", "file-modification-indicator"]
# center = ["diagnostics", "spacer", "workspace-diagnostics", "spacer"]
# right  = ["register", "selections", "separator", "spacer", "primary-selection-length", "separator", "spacer", "position", "separator", "spacer", "position-percentage", "separator", "spacer", "file-type"]
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
A-x = ["collapse_selection", "keep_primary_selection"]
Cmd-s = ":w"
Cmd-S-s = ":write-buffer-close"
Cmd-q = ":buffer-close"
Cmd-c = "yank_main_selection_to_clipboard"
C-c = "yank_main_selection_to_clipboard"
C-s = ":w"
C-S-s = ":write-buffer-close"
C-q = ":buffer-close"
C-1 = ":buffer-close!"
C-S-q = ":q!"
C-right =["move_next_word_start"]
C-left = ["move_prev_word_end"]
A-y = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"] # Move line up
A-h = ["extend_to_line_bounds", "delete_selection", "move_line_down", "paste_before"] # Move line down
ret = "open_below"
# D = "delete_char_forward"
0 = "goto_line_start"
# A-0 = "goto_line_end"
K = "insert_newline" # ?
X = ["extend_line_above"]
# Duplicate line, preserving the position
C-x = ["save_selection", "collapse_selection", "extend_line_below", "yank", "paste_after", "flip_selections", "collapse_selection", "jump_backward"]
"'" = "change_selection"
c = "toggle_comments"
r="replace_selections_with_primary_clipboard"
C-r=":run-shell-command"

C-h="goto_first_nonwhitespace"
C-l="goto_line_end"
C-o="expand_selection"
C-i="shrink_selection"
C-n=["search_selection", "search_next"]
"C-/"="search_selection"

"g" = { a = "code_action" }
"G" = ["goto_last_line"]
"D" = ["extend_to_line_bounds", "delete_selection"]
"$" = ["goto_line_end"]
"end" = ["goto_line_end_newline"]

A-1 = "jump_backward"
A-2 = "jump_forward"
A-9 = "jump_backward"
A-0 = "jump_forward"
"A-=" = "save_selection"
"A-j" = "save_selection"

C-S-a="decrement"
"A-S-}" = "increment"
# A-left = "extend_char_left"
# A-right = "extend_char_right"
S-left = "extend_char_left"
S-right = "extend_char_right"
A-S-left = "extend_prev_sub_word_start"
A-S-right = "extend_next_sub_word_end"

