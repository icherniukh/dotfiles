# --- Plugins (tpm: prefix I install, prefix U update) -----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save, C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # autosave every 15m, restore on start
set -g @plugin 'laktak/extrakto'               # prefix Tab: fuzzy-pick text/paths/urls from pane
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix Space: menu of all keys
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @extrakto_clip_tool_run 'tmux_osc52'    # copy goes to phone/desktop via OSC 52
# continuum hooks its autosave into status-right, which Moshi blanks; run it from the left too
set -ga status-left "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
run '~/.config/tmux/plugins/tpm/tpm'

# Alt-Space opens which-key without the prefix (easier on a phone keyboard)
bind -n M-Space show-wk-menu-root
