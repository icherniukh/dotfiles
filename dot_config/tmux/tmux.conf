# ~/.config/tmux/tmux.conf — managed by chezmoi (tmux 3.5+)
# Prefix: C-b (default)

# --- Terminal: true color, keys, focus -------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"          # 24-bit color on the outer terminal
set -as terminal-overrides ",*:Tc"          # fallback for older terminfo
set -as terminal-features ",*:clipboard"    # allow OSC 52 even if outer terminfo lacks Ms
set -as terminal-features ",xterm-256color:RGB:clipboard:hyperlinks:usstyle:sync"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle:sync"
set -g extended-keys on                     # pass modified keys (C-Enter, S-Tab...) to apps
set -g extended-keys-format csi-u
set -as terminal-features ",*:extkeys"
set -g focus-events on
set -sg escape-time 10
set -g allow-passthrough on                 # images/OSC sequences from inner apps
set -g set-clipboard on                     # copy reaches local machine via OSC 52
# On macOS also pipe copies straight into the system clipboard.
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command "pbcopy"'
set -g set-titles on
set -g set-titles-string "#S:#W — #h"

# --- Behaviour --------------------------------------------------------------
set -ga update-environment MOSHI_CLIENT     # Moshi sets it on attach; statusline reads it
set -g mouse on                             # wheel scrolls history, drag selects+copies
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                # closing a session switches to another instead of dropping you out
set -g display-time 2000
set -g status-interval 15
setw -g aggressive-resize on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

# --- Keys -------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation (arrows still work) and repeatable resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-k clear-history \; display "scrollback cleared"

# --- Mouse and scrolling: behave like a plain terminal -----------------------
# Wheel up:  app with mouse support (helix, yazi, lazygit) -> pass through
#            full-screen app without mouse (less, man, git log) -> arrow keys
#            shell -> enter scrollback; scrolling back to the bottom exits it
bind -n WheelUpPane \
  if -F "#{mouse_any_flag}" { send -M } \
  { if -F "#{pane_in_mode}" { send -M } \
    { if -F "#{alternate_on}" { send -N 3 Up } { copy-mode -e } } }
bind -n WheelDownPane \
  if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" { send -M } \
  { if -F "#{alternate_on}" { send -N 3 Down } }

# Scroll 3 lines per wheel step, like the terminal
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 3 scroll-down

# Drag to select copies on release. At the bottom it drops back to the prompt;
# when scrolled back it keeps the position instead of jumping to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane \
  if -F "#{==:#{scroll_position},0}" { send -X copy-pipe-and-cancel } { send -X copy-pipe-no-clear }
bind -T copy-mode MouseDragEnd1Pane \
  if -F "#{==:#{scroll_position},0}" { send -X copy-pipe-and-cancel } { send -X copy-pipe-no-clear }

# Shift+PageUp/PageDown scroll the scrollback without the prefix
bind -n S-PageUp copy-mode -eu
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

# --- Copy mode keys (vi) -----------------------------------------------------
setw -g mode-keys vi
set -g status-keys emacs
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- Theme: neutral graphite + apricot --------------------------------------
# Tuned for the client theme (bg #1e1e1e, fg #d6d8e0): the bar is a lighter
# neutral strip so it stands apart from pane content and from app status lines.
# strip #2b2b2b  muted #7c7e86  text #a3a5ad  apricot #f2b36e  seafoam #86d4bd  coral #ff938a
set -g status-position top    # stays visible when the phone keyboard opens
set -g status-justify left
set -g status-style "bg=#2b2b2b,fg=#a3a5ad"
set -g status-left-length 40
set -g status-right-length 60
# Moshi (iOS client) runs `set -g status-right ''` on attach, so everything
# essential lives on the left; the right side is desktop-only extras.
# [s:name]: apricot while prefix is held, seafoam in copy mode
set -g status-left "#{?client_prefix,#[fg=#f2b36e bold],#{?pane_in_mode,#[fg=#86d4bd],#[fg=#7c7e86]}}[s:#S]#[default] "
set -g status-right "#[fg=#7c7e86]%H:%M #h"

# Tabs: one colour per tab, the state tints both the block and the text.
#   normal   #383838 / #a3a5ad   current #4d3d2c / #f2b36e (bold)
#   activity #2f3d39 / #86d4bd   bell    #4a312e / #ff938a
setw -g window-status-separator " "
setw -g window-status-format "#{?window_bell_flag,#[bg=#4a312e fg=#ff938a],#{?window_activity_flag,#[bg=#2f3d39 fg=#86d4bd],#[bg=#383838 fg=#a3a5ad]}} #I.#W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[bg=#4d3d2c,fg=#f2b36e,bold] #I.#W#{?window_zoomed_flag, Z,} "
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "none"
setw -g monitor-activity on
set -g visual-activity off

setw -g pane-border-style "fg=#3a3a3a"
setw -g pane-active-border-style "fg=#f2b36e"
set -g display-panes-active-colour "#f2b36e"
set -g display-panes-colour "#7c7e86"
set -g message-style "bg=#383838,fg=#d6d8e0"
set -g message-command-style "bg=#383838,fg=#d6d8e0"
setw -g mode-style "bg=#4d3d2c,fg=#f2b36e"
setw -g clock-mode-colour "#f2b36e"

# --- Terminal colours: "graphite oxide" --------------------------------------
# Disabled: themes belong in the client (Moshi/desktop). Kept as a reference palette —
# port these hexes to the client theme, or uncomment to force them inside tmux.
# tmux repaints every pane with this palette, so it looks the same from any client
# (Moshi, desktop) without touching the client's own theme.
# Warm paper text on blue-black graphite; ANSI hues are the status-bar accents.
# setw -g window-style "bg=#131417,fg=#d8d4cc"
# setw -g window-active-style "bg=#131417,fg=#d8d4cc"
# setw -g cursor-colour "#f2a65a"
# setw -g pane-colours[0] "#26282e"   # black
# setw -g pane-colours[1] "#e0736b"   # red: coral
# setw -g pane-colours[2] "#9fc38a"   # green: sage
# setw -g pane-colours[3] "#f2a65a"   # yellow: apricot
# setw -g pane-colours[4] "#7f9fcf"   # blue: steel
# setw -g pane-colours[5] "#c490c4"   # magenta: orchid
# setw -g pane-colours[6] "#7fd1b9"   # cyan: seafoam
# setw -g pane-colours[7] "#b8b4ac"   # white
# setw -g pane-colours[8] "#5c606e"   # bright black
# setw -g pane-colours[9] "#ff8b7b"
# setw -g pane-colours[10] "#b6d89f"
# setw -g pane-colours[11] "#ffc185"
# setw -g pane-colours[12] "#a3bff0"
# setw -g pane-colours[13] "#dcaee0"
# setw -g pane-colours[14] "#a6e6d3"
# setw -g pane-colours[15] "#ece8e0"  # bright white

# --- Plugins (tpm: prefix I install, prefix U update) -----------------------
# tpm itself comes from .chezmoiexternal.toml; plugins install next to it (untracked).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save, C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # autosave every 15m, restore on start
set -g @plugin 'laktak/extrakto'               # prefix Tab: fuzzy-pick text/paths/urls from pane
set -g @plugin 'alexwforsythe/tmux-which-key'  # prefix Space: menu of all keys
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# On the Mac, restore by hand (prefix C-r) instead of on every server start.
if-shell '[ "$(uname)" = Darwin ]' "set -g @continuum-restore 'off'"
set -g @extrakto_clip_tool_run 'tmux_osc52'    # copy goes to phone/desktop via OSC 52
# continuum hooks its autosave into status-right, which Moshi blanks; run it from the left too
set -ga status-left "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
# Install missing plugins on first start, then load tpm
if "test -x ~/.config/tmux/plugins/tpm/bin/install_plugins -a ! -d ~/.config/tmux/plugins/tmux-resurrect" \
  "run '~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'

# Alt-Space opens which-key without the prefix (easier on a phone keyboard)
bind -n M-Space show-wk-menu-root
