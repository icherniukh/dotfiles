# tmux config — managed by chezmoi (~/proj/dotfiles/dot_config/tmux/tmux.conf)
# Plugins: TPM from Homebrew, installed into ~/.config/tmux/plugins (not tracked).
# Reload: prefix r  ·  Install/update plugins: prefix I / prefix U

## Prefix ---------------------------------------------------------------------
set -g prefix C-b
bind C-b send-prefix

## Terminal -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:clipboard:hyperlinks:usstyle:sync"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle:sync"
set -s escape-time 10          # no lag on Esc (helix, vim, fzf)
set -s extended-keys on        # Shift+Enter, Ctrl+Tab etc. reach the app
set -s extended-keys-format csi-u
set -s focus-events on
set -g allow-passthrough on    # images / OSC sequences from apps inside tmux
set -g history-limit 100000
set -g set-titles on
set -g set-titles-string "#S · #W"

## Clipboard: copy goes to the macOS clipboard (pbcopy + OSC 52) --------------
set -s set-clipboard on
set -s copy-command "pbcopy"

## Windows and panes ----------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off   # closing a session switches to another one
set -g display-time 2000

# New windows and splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Pane navigation (arrows still work) and repeatable resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind C-k clear-history \; display "scrollback cleared"

## Mouse and scrolling: behave like a plain terminal --------------------------
set -g mouse on

# Wheel up:  app with mouse support (helix, yazi, lazygit) -> pass through
#            full-screen app without mouse (less, man, git log) -> arrow keys
#            shell -> enter scrollback; scrolling back to the bottom exits it
bind -n WheelUpPane \
  if -F "#{mouse_any_flag}" { send -M } \
  { if -F "#{pane_in_mode}" { send -M } \
    { if -F "#{alternate_on}" { send -N 3 Up } { copy-mode -e } } }
bind -n WheelDownPane \
  if -F "#{||:#{mouse_any_flag},#{pane_in_mode}}" { send -M } \
  { if -F "#{alternate_on}" { send -N 3 Down } }

# Scroll 3 lines per wheel step, like the terminal
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 3 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send -X -N 3 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send -X -N 3 scroll-down

# Drag to select copies on release. At the bottom it drops back to the prompt;
# when scrolled back it keeps the position instead of jumping to the bottom.
bind -T copy-mode-vi MouseDragEnd1Pane \
  if -F "#{==:#{scroll_position},0}" { send -X copy-pipe-and-cancel } { send -X copy-pipe-no-clear }
bind -T copy-mode MouseDragEnd1Pane \
  if -F "#{==:#{scroll_position},0}" { send -X copy-pipe-and-cancel } { send -X copy-pipe-no-clear }

# Shift+PageUp/PageDown scroll the scrollback without the prefix
bind -n S-PageUp copy-mode -eu
bind -T copy-mode-vi S-PageUp   send -X page-up
bind -T copy-mode-vi S-PageDown send -X page-down

## Copy mode keys (vi) --------------------------------------------------------
setw -g mode-keys vi
set -g status-keys emacs
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel

## Plugins --------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-ukiyo'            # status bar themes; prefix T switches
set -g @plugin 'tmux-plugins/tmux-resurrect'  # prefix C-s save, prefix C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'  # autosave every 15 min

# Theme: kanagawa matches yazi. Other options: kanagawa/dragon, catppuccin/mocha,
# tokyonight/moon, rose-pine/main, gruvbox/dark (or pick live with prefix T).
set -g @ukiyo-theme "kanagawa/wave"
set -g @ukiyo-plugins "git time"
set -g @ukiyo-show-powerline false
set -g @ukiyo-left-icon session          # turns red while the prefix is active
set -g @ukiyo-show-flags true
set -g @ukiyo-show-timezone false
set -g @ukiyo-time-format "%H:%M"
set -g @ukiyo-refresh-rate 5

set -g @continuum-restore 'off'               # restore manually with prefix C-r
set -g @resurrect-capture-pane-contents 'on'

# Install missing plugins on first start, then load TPM (keep at the bottom)
if "test ! -d ~/.config/tmux/plugins/tmux-ukiyo" \
  "run '/opt/homebrew/opt/tpm/share/tpm/bin/install_plugins'"
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
