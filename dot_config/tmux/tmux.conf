# Colors: Dracula/amber — matches starship-remote and SSH prompt palette
#   bg #16111b  fg #e6d8c7  amber #ffb86c  peach #f2a97f  blood orange #ff7a45

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -sg escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g display-time 2000
set -g status-interval 5
set -g mouse on

# Keep the leader on tmux's default Ctrl+b and clear any muscle-memory overrides.
unbind C-a
set -g prefix C-b
bind C-b send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{window_index}"
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#S:#I'

# === STATUS BAR ===
# Top: stays visible when the mobile soft-keyboard opens
set -g status-position top
set -g status-style "bg=#16111b,fg=#e6d8c7"

# Keep the session label readable while leaving most of the bar for windows.
set -g status-left "#{session_name}"
set -g status-left-length 16
set -g status-left-style "bold fg=#ff7a45"

set -g status-right "#{?client_prefix,^,}%H:%M"
set -g status-right-length 6
set -g status-right-style "fg=#bd93f9"

set -g status-justify left
setw -g window-status-separator      ""
setw -g window-status-format         " #W "
setw -g window-status-current-format " #W "
setw -g window-status-current-style  "bold fg=#f2a97f bg=#352630"
setw -g window-status-style          "fg=#6c5c7c"

# === PANE BORDERS ===
# Solid peach separators, with a brighter edge around the active pane.
set -g pane-border-lines heavy
set -g pane-border-style        "fg=#c4866a"
set -g pane-active-border-style "fg=#f2a97f"

bind r source-file "~/.config/tmux/tmux.conf" \; display "reloaded"

# Replace native ? help with fzf popup for searchable shortcuts
unbind-key ?
bind-key ? display-popup -E -w 100% -h 70% -y S "\
  tmux list-keys -N | \
  fzf --ansi \
      --header='⌨️  TMUX SHORTCUTS' \
      --layout=reverse \
      --border=top \
      --color='hl:148,hl+:148,pointer:161,marker:161,prompt:110' \
      --prompt='🔍 Filter: '"

# === PLUGINS (tpm) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Prefix indicator: keep plugin loaded, but the status line now uses tmux's
# built-in client_prefix flag to save space.
set -g @prefix_highlight_fg '#16111b'
set -g @prefix_highlight_bg '#ffb86c'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#16111b,bg=#f1fa8c'
set -g @prefix_highlight_prefix_prompt '^B'
set -g @prefix_highlight_copy_prompt 'copy'
set -g @prefix_highlight_empty_prompt '     '

if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Alt-Space triggers which-key without needing the prefix (mobile-friendly)
bind -n M-Space show-wk-menu-root
