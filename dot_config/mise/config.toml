[settings]
color = true
experimental = true

[settings.self_update]
auto = true

[tools]
hk = { version = "2.9.0", workflow = "release.yml" } # Pkl schema versions are pinned separately in hk configs.
bun = "1.4.4"
"gem:colorls" = "latest"
node = "26"
python = "3.15.2"
ruby = "4.0"
rust = { version = "stable", profile = "minimal", components = "rustfmt,clippy" }
uv = "latest"
oh-my-pi = { version = "18.13.2", rename_exe = "omp" }
pi = "1.4.0"

[hooks]
postinstall = '''
if printf '%s\n' "$MISE_INSTALLED_TOOLS" | jq -e 'any(.name == "ruby")' >/dev/null 2>&1; then
  mise install --force gem:colorls
fi
'''

[tasks.upg]
description = "Upgrade tools and bump configured versions"
dir = "{{ cwd }}"
raw_args = true
run = "mise upgrade --bump"

[tasks.upgf]
description = "Upgrade and bump tools with a 20-minute minimum release age"
dir = "{{ cwd }}"
raw_args = true
run = "mise upgrade --bump --minimum-release-age 20m"
