[settings]
color = true
experimental = true

[settings.self_update]
auto = true

# `mise use -g` adds new tools to the untracked host file, not chezmoi-managed config.
[settings.write_targets]
tools = "~/.config/mise/conf.d/host.toml"

# Runtime defaults live in conf.d/00-shared.toml so conf.d/host.toml can override them.

[hooks]
postinstall = '''
command -v jq >/dev/null 2>&1 || {
  printf '%s\n' 'mise postinstall: jq is required to detect Ruby installs' >&2
  exit 127
}
ruby_installed=$(printf '%s\n' "$MISE_INSTALLED_TOOLS" | jq -r 'any(.name == "ruby")') || exit $?
if [ "$ruby_installed" = true ]; then
  mise install --force gem:colorls
fi
'''

[tasks.upg]
description = "Upgrade tools and bump configured versions"
dir = "{{ cwd }}"
raw_args = true
run = "mise upgrade --bump"

[tasks.upgf]
description = "Upgrade and bump tools with a 20-minute minimum release age"
dir = "{{ cwd }}"
raw_args = true
run = "mise upgrade --bump --minimum-release-age 20m"
