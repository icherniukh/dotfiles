[mgr]

ratio = [0, 3, 5]
sort_by = "natural"
show_hidden = false
mouse_events = ["click", "scroll"]
show_symlink = false
linemode = "size"
wrap = "yes"
# sort_sensitive = false
# sort_reverse 	 = false
# sort_dir_first = true
# sort_translit  = false
# linemode       = "none"
# scrolloff      = 5
# title_format   = "Yazi: {cwd}"
# [sort]
# group_dirs = true    # Group directories together
# dir_action = "first" # Show directories first

[opener]

edit = [{ run = '$EDITOR "$@"', block = true }]

[open]

rules = [
  { mime = "text/*", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.xml", use = "edit" },
  { name = "Config", use = "edit" },
  { name = "*.conf", use = "edit" },
  { name = "*.py", use = "edit" },
  { mime = "application/json", use = "edit" },
  # { name = "*.xml", use = "edit" },
  # 	{ name = "*.html", use = [ "open", "edit" ] },
]

[preview]

wrap = "yes"
tab_size = 2
max_width = 1500
max_height = 1500
# image_delay = 30
# image_filter = "triangle"
# image_quality = 75
# sixel_fraction = 15
# ueberzug_scale = 1
# ueberzug_offset = [0, 0, 0, 0]

[tasks]

image_alloc = 0
image_bound = [0, 0]

[plugin]

prepend_fetchers = [
  { id = "git", url = "*", run = "git" },
  { id = "git", url = "*/", run = "git" },
  { id = "mime", url = "local://*", run = "mime-ext.local", prio = "high" },
  { id = "mime", url = "remote://*", run = "mime-ext.remote", prio = "high" },
  { id = "mactag", url = "*", run = "mactag" },
  { id = "mactag", url = "*/", run = "mactag" },
]

prepend_previewers = [
  # { name = "*.md", run = "code" },
  { name = "*.xml", run = "code" },
  { name = "*.json", run = "code" },
  { name = "Config", run = "code" },
  { name = "*.bin", run = "hexyl" },
  { name = "*.hex", run = "hexyl" },
  { name = "*.md", run = "code" },
  # { name = "*.lua", run = "code" },
  # { name = "*.csv", run = "rich" },
  # { name = "*.md", run = "mcat" },
  # { name = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
  # { name = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
  # { name = "*.json", run = "rich-preview"}, # for json (.json) files
  #    { name = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
]

[log]
enabled = false
